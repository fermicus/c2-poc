<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Helios C2{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            HELIOS <span style="color:var(--pink);">C2</span>
        </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if active == 'home' %}active{% endif %}">
          <img src="/static/assets/icons/home.svg" alt="" class="nav-icon-svg" />
          Home
        </a>
        <a href="/beacons" class="nav-item {% if active == 'beacons' %}active{% endif %}">
          <img src="/static/assets/icons/beacons.svg" alt="" class="nav-icon-svg" />
          Beacons
        </a>
        <a href="/commands" class="nav-item {% if active == 'commands' %}active{% endif %}">
          <img src="/static/assets/icons/commands.svg" alt="" class="nav-icon-svg" />
          Commands
        </a>
        <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">
          <img src="/static/assets/icons/history.svg" alt="" class="nav-icon-svg" />
          History
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-divider"></div>
        <button class="nav-item ghost nuke-btn" onclick="nukeData()">
        <img src="/static/assets/icons/nuke.svg" alt="" class="nav-icon-svg" />
        Nuke Data
        </button>
        <a href="https://github.com" target="_blank" class="nav-item ghost">
          <img src="/static/assets/icons/github.svg" alt="GitHub" class="icon-svg" />
          Source
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/particles.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
